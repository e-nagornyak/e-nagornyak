<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#E9ECFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 40) scale(380 280)">
      <stop stop-color="#6366F1" stop-opacity=".38">
        <animate attributeName="stop-color" values="#6366F1;#A855F7;#06B6D4;#6366F1" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 300) scale(400 240)">
      <stop stop-color="#06B6D4" stop-opacity=".3">
        <animate attributeName="stop-color" values="#06B6D4;#6366F1;#EC4899;#06B6D4" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <!-- reflect + a shift of exactly 2×width loops the shimmer without a seam -->
    <linearGradient id="name" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop stop-color="#1E1B4B"/>
      <stop offset=".55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1280 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop stop-color="#4F46E5" stop-opacity=".12"/>
      <stop offset=".42" stop-color="#4F46E5" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#6366F1" stop-opacity="1"/>
      <stop offset=".58" stop-color="#4F46E5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity=".12"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="1200 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#4F46E5" stroke-opacity=".07"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath>
    <clipPath id="l1"><rect x="0" y="44" width="0" height="26"><animate attributeName="width" values="0;0;230;230;0" keyTimes="0;.04;.14;.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l2"><rect x="0" y="68" width="0" height="26"><animate attributeName="width" values="0;0;230;230;0" keyTimes="0;.16;.26;.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l3"><rect x="0" y="92" width="0" height="26"><animate attributeName="width" values="0;0;230;230;0" keyTimes="0;.28;.38;.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="l4"><rect x="0" y="116" width="0" height="26"><animate attributeName="width" values="0;0;230;230;0" keyTimes="0;.40;.50;.92;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .float-a { animation: drift 9s ease-in-out infinite alternate; }
      .float-b { animation: drift 11s ease-in-out infinite alternate-reverse; }
      .card { animation: hover 6s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-60px, 24px); } }
      @keyframes hover { 50% { transform: translate(860px, 62px); } }
      @keyframes blink { 50% { opacity: 0; } }
      text { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono, .mono text { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <ellipse class="float-a" cx="980" cy="40" rx="380" ry="280" fill="url(#glowA)"/>
    <ellipse class="float-b" cx="160" cy="300" rx="400" ry="240" fill="url(#glowB)"/>

    <text x="80" y="104" class="mono" font-size="20" fill="#4F46E5">~/evhen $ whoami<tspan class="cursor" fill="#6366F1">▍</tspan></text>
    <text x="78" y="172" font-size="64" font-weight="700" fill="url(#name)" letter-spacing="-1">Evhen Nagornyak</text>
    <text x="80" y="218" font-size="26" fill="#334155">Full-Stack &amp; Mobile Developer</text>
    <text x="80" y="254" font-size="18" fill="#64748B">React · Next.js · Vue · React Native · NestJS · TypeScript</text>

    <g class="card mono" transform="translate(860 70)" style="transform: translate(860px, 70px)" font-size="15">
      <rect width="260" height="160" rx="14" fill="#14132B" fill-opacity=".96" stroke="#4F46E5" stroke-opacity=".25"/>
      <circle cx="22" cy="22" r="5" fill="#FF5F57"/>
      <circle cx="40" cy="22" r="5" fill="#FEBC2E"/>
      <circle cx="58" cy="22" r="5" fill="#28C840"/>
      <text x="22" y="62" fill="#C084FC" clip-path="url(#l1)">const <tspan fill="#E2E8F0">dev</tspan> <tspan fill="#94A3B8">=</tspan> {</text>
      <text x="40" y="86" fill="#7DD3FC" clip-path="url(#l2)">ships<tspan fill="#94A3B8">:</tspan> <tspan fill="#86EFAC">"daily"</tspan>,</text>
      <text x="40" y="110" fill="#7DD3FC" clip-path="url(#l3)">from<tspan fill="#94A3B8">:</tspan> <tspan fill="#86EFAC">"Ukraine"</tspan>,</text>
      <text x="40" y="134" fill="#7DD3FC" clip-path="url(#l4)">stack<tspan fill="#94A3B8">:</tspan> <tspan fill="#FCD34D">"TS"</tspan> }</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="23" stroke="url(#border)" stroke-width="2"/>
</svg>
