<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1740"/>
      <stop offset="1" stop-color="#0B0B1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 132) scale(560 160)">
      <stop stop-color="#6366F1" stop-opacity=".5">
        <animate attributeName="stop-color" values="#6366F1;#A855F7;#06B6D4;#6366F1" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- reflect + a shift of exactly 2×width loops the shimmer without a seam -->
    <linearGradient id="title" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="840 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset=".42" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset=".5" stop-color="#A5B4FC" stop-opacity=".9"/>
      <stop offset=".58" stop-color="#FFFFFF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="1200 0" to="-1200 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".045"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="132" rx="24"/></clipPath>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .arrow { animation: nudge 1.6s ease-in-out infinite; }
      .sweep { animation: sweep 6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .2; transform: scale(2.2); } }
      @keyframes nudge { 50% { transform: translateX(6px); } }
      @keyframes sweep { from { transform: translateX(-300px) skewX(-20deg); } 60%, to { transform: translateX(1300px) skewX(-20deg); } }
      text { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="132" fill="url(#bg)"/>
    <rect width="1200" height="132" fill="url(#grid)"/>
    <rect width="1200" height="132" fill="url(#glow)"/>
    <rect class="sweep" width="240" height="132" fill="url(#sweep)"/>
    <circle class="pulse" cx="398" cy="66" r="6" fill="#4ADE80" fill-opacity=".5"/>
    <circle cx="398" cy="66" r="6" fill="#4ADE80"/>
    <text x="420" y="76" font-size="28" font-weight="600" fill="url(#title)">Let's build something together</text>
    <g class="arrow"><path d="M846 66H874M864 56L874 66L864 76" stroke="#A5B4FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <rect x="1" y="1" width="1198" height="130" rx="23" stroke="url(#border)" stroke-width="2"/>
</svg>
